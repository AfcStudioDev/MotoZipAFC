server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Три фото на запчасть (см. лимит в AdminController) — с запасом на оригиналы до сжатия.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Перегенерируется entrypoint-скриптом при каждом старте контейнера —
    # не кешируем, иначе браузер не увидит новые значения из .env.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Бэкенд на том же origin, что и фронтенд — браузеру не нужен CORS,
    # а сам бэкенд наружу не публикуется (см. docker-compose.yml).
    # "^~" обязателен: без него regex-location ниже (по расширению файла)
    # перехватил бы *.webp из /ZipPhotos/ раньше, чем сработает проксирование,
    # и nginx пытался бы искать фото среди своих же файлов сборки.
    location ^~ /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фотографии запчастей отдаёт бэкенд через UseStaticFiles (wwwroot/ZipPhotos).
    location ^~ /ZipPhotos/ {
        proxy_pass http://api:8080/ZipPhotos/;
        proxy_set_header Host $host;
    }

    # У файлов сборки хеш в имени — можно кешировать надолго.
    # Ниже /api/ и /ZipPhotos/ по той же причине "^~" выше.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA: неизвестные пути отдаём index.html, дальше маршрутизирует Angular Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
